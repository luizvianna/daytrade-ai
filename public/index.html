<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080c14" />
    <meta name="description" content="TradeAI — IA de Investimentos para a B3" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>TradeAI — IA de Investimentos B3</title>
    <style>
      /* ── Reset e base ── */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { background: #080c14; min-height: 100vh; }
      body { font-family: 'DM Sans', 'Segoe UI', sans-serif; color: #e0e6f0; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      select, input, textarea, button { outline: none; font-family: inherit; }
      button { cursor: pointer; }

      /* ── Scrollbar ── */
      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

      /* ── Animações globais ── */
      .pulse { animation: pulse 2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); opacity: 0.4; }
        50% { transform: translateY(-5px); opacity: 1; }
      }
      
            .spin { animation: spin 1s linear infinite; }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
 
      /* ── Botões globais ── */
      button { transition: transform 0.08s ease; }
      button:active { transform: scale(0.97); }

      /* ── Chat ── */
      .chat-input:focus {
        border-color: #00e5a0 !important;
        box-shadow: 0 0 0 3px #00e5a022;
      }
      .send-btn:hover { background: #00b07a !important; }
      .sugestao:hover {
        border-color: #00e5a055 !important;
        background: #00e5a011 !important;
        color: #00e5a0 !important;
      }

      /* ── Score ── */
      .prog { height: 6px; background: #1e2d45; border-radius: 3px; overflow: hidden; }
      .prog-fill {
        height: 100%;
        background: linear-gradient(90deg, #00e5a0, #006eff);
        border-radius: 3px;
        transition: width 0.3s;
      }

      /* ── Sidebar ── */
      .sidebar-item:hover {
        background: #00e5a011 !important;
        color: #ccc !important;
      }

      /* ── Login ── */
      .login-input:focus { border-color: #00e5a0 !important; box-shadow: 0 0 0 3px #00e5a022; }
      .btn-login:hover { transform: translateY(-1px); box-shadow: 0 8px 24px #00e5a044; }
      .btn-login:active { transform: translateY(0); }
      @keyframes fadeIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
      .card { animation: fadeIn 0.4s ease; }
      @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
      .shake { animation: shake 0.3s ease; }

      /* ── Backtesting / Relatorio / PaperTrading ── */
      .panel { background: #0d1320; border: 1px solid #1e2d45; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
      .stat  { background: #0d1320; border: 1px solid #1e2d45; border-radius: 10px; padding: 12px 14px; }

      /* ── Alertas ── */
      .tab-btn:hover { color: #aaa !important; }

      /* ── Backtesting/Backtest tabs ── */
      .tab { background: none; border: none; color: #555; padding: 8px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; font-family: inherit; }
      .tab.active { color: #00e5a0; border-bottom-color: #00e5a0; }
      .tab:hover { color: #aaa; }
      .period-btn { background: #0d1320; border: 1px solid #1e2d45; border-radius: 8px; padding: 7px 14px; color: #666; font-size: 12px; cursor: pointer; transition: all 0.2s; font-family: monospace; }
      .period-btn:hover { border-color: #2a3f5f; color: #aaa; }
      .period-btn.active { border-color: #00e5a0; color: #00e5a0; background: #00e5a011; }
    </style>
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para usar este aplicativo.</noscript>
    <div id="root"></div>
  </body>
</html>
