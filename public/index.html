<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080c14" />
    <meta name="description" content="TradeAI — IA de Investimentos para a B3" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonte carregada fora do React: evita @import dinâmico que causa
         conflitos de DOM (removeChild) ao trocar de página no React 19 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <title>TradeAI — IA de Investimentos B3</title>

    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { background: #080c14; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      select, input, textarea, button { outline: none; }

      ::-webkit-scrollbar { width: 4px; }
      ::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }

      .pulse { animation: pulse 2s infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

      .tradeai-root button { transition: transform 0.08s ease; }
      .tradeai-root button:active { transform: scale(0.97); }
    </style>
  </head>
  <body>
    <noscript>Você precisa habilitar o JavaScript para usar este aplicativo.</noscript>
    <div id="root"></div>
  </body>
</html>
